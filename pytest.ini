[pytest]
markers =
    fast: deterministic helper regressions — no wasm loader, run in milliseconds (default).
    slow: exercises the gltest wasm runner against a live network — requires GEN + network access.
    studionet: requires the GenLayer studionet RPC to be reachable.
    localnet: requires a running gltest localnet on http://127.0.0.1:4000/api.
addopts = -q --strict-markers
